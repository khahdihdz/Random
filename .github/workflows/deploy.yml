name: Deploy Random to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site and JavaScript
        shell: bash
        run: |
          set -e
          test -s index.html
          grep -q 'id="wheelGrid"' index.html
          grep -q 'await spinWheel(results\[0\])' index.html
          grep -q 'crypto.getRandomValues' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert "<html" in html.lower() and "</html>" in html.lower()
          assert 'id="wheelGrid"' in html
          assert "wheelEntriesOverride" in html
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          inline = [s for s in scripts if s.strip()]
          assert inline, "Inline JavaScript block not found"
          Path("/tmp/random-inline.js").write_text(inline[0], encoding="utf-8")
          print("HTML and wheel synchronization checks passed")
          PY
          node --check /tmp/random-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
